name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION_NAME="${TAG%%-*}"
          MAJOR="${VERSION_NAME%%.*}"
          REST="${VERSION_NAME#*.}"
          if [ "$REST" = "$VERSION_NAME" ]; then
            MINOR=0
            PATCH=0
          else
            MINOR="${REST%%.*}"
            PATCH="${REST#*.}"
            if [ "$PATCH" = "$REST" ]; then
              PATCH=0
            else
              PATCH="${PATCH%%.*}"
            fi
          fi
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "APP_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "RELEASE_STORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --stacktrace
          -PappVersionName="${APP_VERSION_NAME}"
          -PappVersionCode="${APP_VERSION_CODE}"

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/abs-mini-android-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/abs-mini-android-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

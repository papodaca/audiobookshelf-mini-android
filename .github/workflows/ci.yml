name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Test and assemble debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults to 'tools platform-tools'; Google no longer serves the
          # legacy 'tools' package, so sdkmanager fails with
          # "Failed to find package 'tools'" before Gradle ever runs.
          # The next step installs the platform and build-tools we use.
          packages: 'platform-tools'

      - name: Install platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core tests and assemble debug
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
